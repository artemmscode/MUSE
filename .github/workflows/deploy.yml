name: Deploy MUSE to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve deployment paths
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
        run: |
          set -euo pipefail

          if [ -z "${VITE_SUPABASE_URL}" ]; then
            echo "::error::Add repository variable VITE_SUPABASE_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi
          if [ -z "${VITE_SUPABASE_ANON_KEY}" ]; then
            echo "::error::Add repository variable VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"

          if [ -z "${VITE_BASE_PATH}" ]; then
            if [ "${REPO_NAME}" = "${OWNER}.github.io" ]; then
              VITE_BASE_PATH="/"
            else
              VITE_BASE_PATH="/${REPO_NAME}/"
            fi
          fi
          case "${VITE_BASE_PATH}" in
            /*) ;;
            *) VITE_BASE_PATH="/${VITE_BASE_PATH}" ;;
          esac
          case "${VITE_BASE_PATH}" in
            */) ;;
            *) VITE_BASE_PATH="${VITE_BASE_PATH}/" ;;
          esac

          if [ -z "${VITE_SITE_URL}" ]; then
            if [ "${REPO_NAME}" = "${OWNER}.github.io" ]; then
              VITE_SITE_URL="https://${OWNER}.github.io"
            else
              VITE_SITE_URL="https://${OWNER}.github.io/${REPO_NAME}"
            fi
          fi
          VITE_SITE_URL="${VITE_SITE_URL%/}"

          {
            echo "VITE_BASE_PATH=${VITE_BASE_PATH}"
            echo "VITE_SITE_URL=${VITE_SITE_URL}"
          } >> "$GITHUB_ENV"

          echo "Base path: ${VITE_BASE_PATH}"
          echo "Site URL:  ${VITE_SITE_URL}"

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
