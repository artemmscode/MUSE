<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MUSE</title>
    <script>
      // Single-page-app fallback for GitHub Pages.
      // `__MUSE_BASE__` is replaced at build time with Vite's `base`
      // ("/" for a custom domain / user site, "/MUSE/" for a project page).
      (function () {
        var base = '__MUSE_BASE__';
        var location = window.location;
        var path = location.pathname;

        if (base !== '/' && path.indexOf(base) === 0) {
          path = path.slice(base.length - 1);
        }

        var route = path || '/';
        var query = location.search
          ? '&' + location.search.slice(1).replace(/&/g, '~and~')
          : '';

        location.replace(
          location.origin +
            base +
            '?/' +
            route.replace(/&/g, '~and~') +
            query +
            location.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
