<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="MUSE — a private, beautifully curated music library."
    />
    <meta property="og:title" content="MUSE" />
    <meta property="og:description" content="A private music library. Curated by you." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <title>MUSE — Private Music Library</title>
    <script>
      // GitHub Pages SPA fallback: restore the path saved by 404.html.
      (function () {
        var redirect = window.location.search;
        if (redirect && redirect.indexOf('?/') === 0) {
          var route = redirect
            .slice(1)
            .split('&')
            .map(function (part) {
              return part.replace(/~and~/g, '&');
            })
            .join('?');
          var base = window.location.pathname.replace(/\/index\.html$/, '/');
          window.history.replaceState(null, null, base.replace(/\/$/, '') + route + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
