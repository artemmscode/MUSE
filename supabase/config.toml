# MUSE — Supabase CLI configuration
# Docs: https://supabase.com/docs/guides/local-development/cli/config

project_id = "muse"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[functions.telegram-auth]
# Telegram initData is the credential; Supabase JWT verification is not used.
verify_jwt = false
