# ════════════════════════════════════════════════════════════════════════════
# MUSE Bot — Render Blueprint (free web service)
#
# Render free web services spin down after 15 minutes without incoming HTTP
# traffic. A polling Telegram bot generates no traffic, so the bot also serves
# a tiny /health endpoint and an external uptime monitor pings it every
# 5 minutes. See README step 16 for the exact setup.
#
# Deploy: Render Dashboard → New → Blueprint → connect this repository.
# Then fill every env var marked `sync: false` in the dashboard.
#
# Want to drop the pinger? Switch to a paid background worker instead:
#   type: worker
#   plan: starter
#   (remove healthCheckPath)
# ════════════════════════════════════════════════════════════════════════════

services:
  - type: web
    name: muse-bot
    runtime: python
    plan: free
    region: frankfurt
    rootDir: bot
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_OWNER_ID
        sync: false
      - key: TELEGRAM_ALLOWED_IDS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MUSE_OWNER_ID
        sync: false
      - key: SITE_URL
        sync: false
      - key: AUDIO_BUCKET
        value: audio
      - key: COVERS_BUCKET
        value: covers
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: SOUNDCLOUD_CLIENT_ID
        sync: false
      - key: SOUNDCLOUD_CLIENT_SECRET
        sync: false
      - key: LOG_LEVEL
        value: INFO
